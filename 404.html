<style>
/* A plain reading page in the site's system: sharp sections, one 680px column, Cormorant SC headings, Manrope text, mono facts. */
:root{--white:#FFFFFF;--ink:#121212;--navy:#18263A;--ivory:#F8F5EF;--mist:#FBF8F2;--gold:#C9B48A;--gold-text:#7D6A45;--body:#3F3C37;--muted:#6F675C;--hair:#E8E3D8;
  --sc:'Cormorant SC',Georgia,serif;--sans:Manrope,'Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--pad:max(20px,5vw)}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--gold-text);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(var(--pad),env(safe-area-inset-left,0px));padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.cp{font-family:Copperplate,'Copperplate Gothic Light','Copperplate Gothic','Copperplate Gothic Std',var(--sc);text-transform:uppercase;letter-spacing:.18em;font-weight:400}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px 32px;padding-block:24px}
.brand{display:inline-flex;align-items:center;gap:14px}
.brand .mw-mark{display:block;height:32px;width:auto}
.brand .word{display:block;width:min(250px,52vw);height:auto}
.doc{max-width:680px;margin:0 auto;padding-block:clamp(48px,8vh,96px) clamp(64px,10vh,120px);border-top:1px solid var(--hair)}
.doc .meta{color:var(--muted)}
.doc h1{font-family:var(--sc);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(36px,4.4vw,54px);line-height:1.05;margin:16px 0 0}
.doc .lede{font-size:19px;line-height:1.7;color:var(--ink);margin:26px 0 0}
.doc h2{font-family:var(--sc);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(22px,2.2vw,27px);line-height:1.15;margin:52px 0 14px}
.doc h2 .mono{color:var(--gold-text);font-size:11px;margin-right:12px;vertical-align:.25em;letter-spacing:.04em}
.doc p,.doc li{font-size:17px;line-height:1.75;color:var(--body)}
.doc p{margin:0 0 16px}
.doc ul{margin:0 0 18px;padding:0;list-style:none}
.doc li{position:relative;padding-left:24px;margin-bottom:8px}
.doc li::before{content:"";position:absolute;left:2px;top:.85em;width:11px;height:1px;background:var(--gold)}
.doc strong{font-weight:600;color:var(--ink)}
.doc a.in{color:var(--ink);border-bottom:1px solid var(--gold)}
.doc a.in:hover{color:var(--gold-text)}
.doc a.ext{color:var(--ink);border-bottom:1px solid var(--gold)}
.doc a.ext::after{content:"↗";font-family:var(--mono);font-size:.7em;color:var(--gold-text);margin-left:2px;vertical-align:.25em}
.facts{border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin:6px 0 20px}
.facts div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:16px;padding:13px 18px;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6;color:var(--body)}
.facts div:first-child{border-top:0}
.facts dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);padding-top:.3em}
.facts dd{margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:8px;font-size:14.5px;font-weight:600;background:var(--navy);color:var(--white);padding:13px 20px;border-radius:8px}
.btn::after{content:"→"}
footer{padding-block:40px 48px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border-top:1px solid var(--hair)}
footer .cp{font-size:12px;color:var(--muted)}
@media (max-width:600px){.facts div{grid-template-columns:minmax(0,1fr);gap:4px}}
.lost{max-width:680px;margin:0 auto;padding-block:clamp(64px,12vh,140px);border-top:1px solid var(--hair);text-align:center}
.lost .code{font-family:var(--mono);font-size:12px;color:var(--gold-text);letter-spacing:.14em}
.lost h1{font-family:var(--sc);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(34px,4.4vw,52px);line-height:1.08;margin:18px 0 0;text-wrap:balance}
.lost p{font-size:17.5px;line-height:1.7;color:var(--body);margin:18px auto 0;max-width:30em}
.ways{display:flex;flex-direction:column;max-width:440px;margin:36px auto 0;border:1px solid var(--hair);border-radius:14px;overflow:hidden;text-align:left}
.ways a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:15px 18px;border-top:1px solid var(--hair);font-size:15.5px;transition:background-color .2s}
.ways a:first-child{border-top:0}
.ways a span{color:var(--muted);font-family:var(--mono);font-size:11px}
.ways a::after{content:"→";color:var(--gold-text);grid-column:2;grid-row:1}
.ways a:hover{background:var(--mist)}
.ways a b{font-weight:500}
/* ---------- Main menu: a floating capsule, white over white, navy over navy ---------- */
header.mhead{padding-block:18px;min-height:42px}
.mnav{position:fixed;z-index:30;top:calc(18px + env(safe-area-inset-top,0px));right:calc(max(0px,(100vw - 1200px) / 2) + max(var(--pad,max(24px,5vw)),env(safe-area-inset-right,0px)));display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--hair);border-radius:999px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 24px rgba(24,38,58,.06);font-size:12px;transition:background-color .4s ease,border-color .4s ease,box-shadow .4s ease}
.mnav a{padding:10px calc(17px - .18em) 10px 17px;border-radius:999px;color:var(--ink);line-height:1;-webkit-tap-highlight-color:transparent;transition:color .4s ease,background-color .2s,transform .12s}
.mnav .s{display:none}
.mnav a:focus-visible{outline:2px solid var(--gold-text);outline-offset:3px}
.mnav a:focus-visible,.mnav a[aria-current="page"]{background:var(--navy);color:var(--white)}
@media (hover:hover){.mnav a:hover{background:var(--navy);color:var(--white)}}
.mnav a:active{background:#0F1A29;color:var(--white);transform:scale(.97)}
.scrolled .mnav{background:rgba(255,255,255,.72);box-shadow:none}
html.nav-dark .mnav{background:rgba(24,38,58,.55);border-color:rgba(217,196,154,.24);box-shadow:none}
html.nav-dark .mnav a{color:var(--navy-ink)}
html.nav-dark .mnav a:focus-visible,html.nav-dark .mnav a[aria-current="page"]{background:var(--navy-ink);color:var(--navy);outline-color:var(--gold-navy)}
@media (hover:hover){html.nav-dark .mnav a:hover{background:var(--navy-ink);color:var(--navy)}}
html.nav-dark .mnav a:active{background:var(--white);color:var(--navy)}
/* first visit on the home page: the capsule settles in, then the links arrive left to right, once */
.mnav.in{animation:navCap .7s cubic-bezier(.2,.7,.2,1) .35s both}
.mnav.in a{animation:navLink .55s cubic-bezier(.2,.7,.2,1) both}
.mnav.in a:nth-child(1){animation-delay:.6s}.mnav.in a:nth-child(2){animation-delay:.7s}.mnav.in a:nth-child(3){animation-delay:.8s}.mnav.in a:nth-child(4){animation-delay:.9s}
@keyframes navCap{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes navLink{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mnav.in,.mnav.in a{animation:none}}
/* tablets and phones: the menu floats centred at the very top, the header sits just below it */
@media (max-width:900px){
  .mnav{top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px)}
  header.mhead{padding-top:78px;justify-content:center}
}
@media (max-width:560px){
  .mnav .l{display:none}.mnav .s{display:inline}
  .mnav{width:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;font-size:11px}
  .mnav a{flex:auto;text-align:center;padding:10px calc(10px - .18em) 10px 10px}
}
</style>

  <nav class="cp mnav" aria-label="Main"><a href="/#work"><span class="l">What we do</span><span class="s">Work</span></a><a href="/about/">About</a><a href="/#letter"><span class="l">The Letter</span><span class="s">Letter</span></a><a href="/#contact">Contact</a></nav>

<script>
/* floating menu and follow pill: each takes the navy look while a navy band is under it */
(() => {
  const r = document.documentElement, nav = document.querySelector('.mnav'), follow = document.getElementById('follow'), dark = [...document.querySelectorAll('.navy-grid')];
  if (!nav) return;
  const over = el => { if (!el) return false; const b = el.getBoundingClientRect(), y = b.top + b.height / 2;
    return dark.some(s => { const q = s.getBoundingClientRect(); return q.top <= y && q.bottom >= y; }); };
  let ticking = false;
  function check() {
    ticking = false;
    r.classList.toggle('scrolled', scrollY > 8);
    r.classList.toggle('nav-dark', over(nav));
    r.classList.toggle('follow-dark', over(follow));
  }
  const ask = () => { if (!ticking) { ticking = true; requestAnimationFrame(check); } };
  addEventListener('scroll', ask, { passive: true }); addEventListener('resize', ask); check();
})();
</script>
